# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The review rules that must not vary between Bymax
# repositories are edited there; everything this repository writes for itself
# lives outside the markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. That is
# why this is a sync and not a `uses:` — the reusable CI in this directory
# propagates by reference, this one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly, off the hour and on a day no other scheduled run uses, so the
    # repository's cron jobs do not cluster.
    - cron: '34 7 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # Named rather than `inherit`, so the called workflow receives these two
      # secrets and not every secret this repository holds.
      #
      # Why a credential of its own is required rather than optional here: a pull
      # request opened with the default GITHUB_TOKEN starts no workflow runs —
      # GitHub's anti-recursion guard, not a misconfiguration — so it arrives
      # carrying no checks at all rather than failing ones, and the
      # nest-storage-pr-and-ci-gates ruleset requires eight. Such a pull request
      # can never merge while reading on screen as merely awaiting review.
      #
      # A GitHub App rather than a long-lived token: the credential is minted per
      # run and expires within the hour, so there is nothing to rotate and
      # nothing that expires unnoticed. The pair is read together and the called
      # workflow fails loudly when only one is set.
      #
      # `sync-token` is deliberately left unmapped. Mapping a secret that does
      # not exist resolves to the empty string, which the called workflow accepts
      # as "no token supplied" and silently falls back from — reintroducing
      # exactly the unmergeable pull request above, from a file that reads as
      # configured.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
