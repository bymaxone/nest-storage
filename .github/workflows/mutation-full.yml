# The full cold mutation run. The logic lives once in `bymaxone/.github`; what stays here is
# what is genuinely local: when it runs and how long it may take.
#
# Why it exists: `stryker.config.json` sets `incremental: true`, so the per-push job re-tests
# only what changed and finishes inside the minutes a routine gate is allowed to take. That is a
# trade — an incremental run reuses stored verdicts, and reused verdicts for STATIC mutants can
# be stale. The fast signal is here every push; the truth is measured cold, once a week.
name: Mutation (full)

on:
  schedule:
    # Off the working day, and staggered against the other libraries so a Monday morning does
    # not start ten cold suites at once.
    - cron: '23 3 * * 1'
  workflow_dispatch:

# Single-flight across the whole repository, deliberately NOT keyed by `github.ref`
# — the same reasoning `peer-advisory-drift.yml` here already carries. What two runs
# would race over is one shared incremental baseline, so a ref-scoped group would put
# a dispatch and the scheduled run in different groups and leave the race intact.
# Queue rather than cancel: a cold run killed halfway leaves no baseline at all,
# which is worse than a second run waiting for the first.
concurrency:
  group: mutation-full
  cancel-in-progress: false

permissions:
  contents: read
  # The reusable reads `gh run list` to decide whether anything can have moved the score.
  actions: read

jobs:
  full:
    uses: bymaxone/.github/.github/workflows/mutation-full.yml@v1
    with:
      inventory: enforce
      # The ceiling is per shard job. A single runner would have needed about 140 minutes for the whole
      # run (the 120-minute job was cancelled at 85% of its mutants), so a shard, a quarter of the
      # mutants plus its own dry run, needs about 40 to 60 minutes, and 150 leaves about twice that
      # worst case: hosted runner speed varies about 1.5x on the same work. A
      # run the ceiling cancels leaves no score and no baseline for the week, while an over-wide
      # ceiling costs only the minutes it uses and nothing blocks on this job.
      timeout-minutes: 150
      # Four shards of two workers each. A mutant costs the time of the tests that cover it, so the run
      # grows with the real-time waits of those specs (sockets, idle and deadline timers) and is split
      # across four runners instead of given a longer one. A worker grows to several GiB over a long
      # run and the hosted runner has 16 GB, so two workers and their parent are what one runner holds.
      # The count and the concurrency are passed here, not written into stryker.config.json, which
      # the per-push incremental job and local runs share.
      shards: 4
      concurrency: 2
