name: No AI attribution
# Its own file, because an edit of a pull request's title or body has to run it again.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Read-only at the workflow level: the job below names the two grants it needs, and a job added later
# starts with no more than this.
permissions:
  contents: read

jobs:
  attribution:
    permissions:
      contents: read
      pull-requests: read
    uses: bymaxone/.github/.github/workflows/no-ai-attribution.yml@v1
