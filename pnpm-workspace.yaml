# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # Denied on purpose: optional native builds reached transitively that nothing
  # here executes. Recording them as `false` states the decision, where leaving
  # them out would only state that nobody looked.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # `jest-haste-map` takes `@parcel/watcher` as a plain dependency from 30.5.0 on, and it
  # ships an `install` script (`node scripts/build-from-source.js`). pnpm 11 refuses to
  # install at all until an unlisted build script is decided either way, so this entry is
  # what lets the install succeed.
  #
  # Denied because nothing here needs the native watcher: CI runs `pnpm test:cov:all` and
  # `pnpm test:e2e`, neither of which watches. `test:watch` is a local convenience, and a
  # denied build costs it the native backend, never correctness.
  '@parcel/watcher': false

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  'brace-expansion@1': '^1.1.17'
  # GHSA-6j4f-fj2g-mc7p (CVSS 7.5), GHSA-qhr7-859c-m2p7 (CVSS 7.5) and GHSA-q2hr-2g5m-vwhr
  # (CVSS 5.3) — algorithmic-complexity denial of service in brace expansion. Arrives through
  # `minimatch` under `archiver` (2.x, via `testcontainers`) and under the lint and test
  # tooling (5.x); `dependencies` is empty, so nothing here ships it. The floors are the
  # first releases that clear all three on each line (2.1.7 and 5.0.12). Remove once
  # `archiver` and `minimatch` resolve at or above them without help.
  'brace-expansion@2': '^2.1.7'
  'brace-expansion@5': '^5.0.12'
  # GHSA-73wf-gq98-2v4g (CVSS 7.5). Arrives as a transitive of @babel/core, which both
  # `jest` and `@stryker-mutator/*` pull in independently — dropping either would not
  # remove it. `dependencies` is empty, so nothing here ships it. A floor rather than an exact
  # version: 4.28.7 is the first patched release, and anything above it stays patched,
  # so resolution is free to move forward without this line needing an edit. Overridden
  # rather than excluded from the scan, which would stay blind after the advisory is gone.
  'browserslist': '^4.28.7'
  'esbuild': '0.28.1'
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp (CVSS 7.5 each) — two host confusion, two SSRF. Arrives through
  # `@babel/core` and `ajv` under the test tooling; `dependencies` is empty and the
  # published tarball carries only `dist/`, so nothing here ships it.
  #
  # A caret range whose lower bound is the first release that clears all four. The
  # advisories begin at different versions (3.0.0, 3.0.0, 3.1.2, 3.1.3), so a bound taken
  # from any one of them leaves another open; 3.1.6 is the first that satisfies every
  # one. Each defect also reaches the 2.x and 4.x lines, so this entry is not a statement
  # that only 3.x was affected.
  'fast-uri@3': '^3.1.9'
  # GHSA-5p4m-2wfm-xmqj (CVSS 7.5). Arrives transitively through the test and lint
  # tooling — more than one path reaches it, so removing any single one would not remove
  # the exposure — and `dependencies` is empty, so nothing here ships it. Both majors are
  # pinned because either can enter that way. Patched rather than excluded from the scan:
  # the fix is a patch bump within each major, and a scanner told to ignore dev
  # dependencies would stay blind after this advisory is gone.
  # GHSA-2883-xcg3-v3hh (CVSS 7.5) — `maxTotalMergeKeys` does not bound CPU use for empty
  # merge sources; 3.15.2 is the first patched 3.x. Reached through `@istanbuljs/load-nyc-config`
  # under jest's coverage tooling.
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.1'
  # GHSA-535w-7cp7-47q4, GHSA-qfvm-cv95-jqjf, GHSA-wc9g-mqfw-jrwm (CVSS 7.5 each),
  # GHSA-q7qp-rjg7-q26m (7.5), GHSA-3pph-fpjx-jg34 (5.3) and GHSA-qvfw-j98x-7q72 (3.7) —
  # aborted-upload resource exhaustion and file-size-limit bypass. Arrives through
  # `@nestjs/platform-express`, which only the test suite uses; nothing here ships it.
  # 2.5.0 is the first release that clears all six. Remove once `@nestjs/platform-express`
  # resolves it at or above that.
  'multer@2': '^2.5.0'
  'protobufjs': '^7.6.5'
  # GHSA-4mjr-xmp4-gh2g (CVSS 5.3, denial of service through an attacker-controlled
  # `isBuffer`) and GHSA-x5fp-wj9c-mxmx (CVSS 3.7, array-limit bypass through comma
  # parsing of bracket keys). A caret rather than an exact version: a security override
  # states a floor, and an exact pin is a ceiling — it refuses the next patch release, so
  # a re-resolve cannot carry the tree forward past the advisory it was written for.
  'qs@6': '^6.16.1'
  # Eleven advisories (CVSS 3.7 – 7.5) in the 8.x line, all closed by 8.12.2: header and
  # cache handling, TLS option propagation and retry-handler leaks. Arrives through
  # `testcontainers` and `@testcontainers/minio`, i.e. only the E2E suite; nothing here ships
  # it. A floor, so resolution stays free to move forward. Remove once `testcontainers`
  # resolves it at or above 8.12.2.
  'undici@8': '^8.12.2'
  # GHSA-8r5x-fm3f-whwj (CVSS 9.8), GHSA-p8wg-vrv2-v86f (9.2) and GHSA-xw65-4hp5-5hc7 (4.7) —
  # JavaScript injection through template compilation. Arrives through `ts-jest`, which
  # compiles only this repository's own sources in tests; nothing here ships it. 4.7.10 is
  # the first patched release. Remove once `ts-jest` resolves it at or above that.
  'handlebars@4': '^4.7.10'
  # GHSA-f596-whhp-79r4 (CVSS 3.7) and GHSA-m9gg-hp2v-232j (7.4) — an authorization-context
  # defect when a certificate is not authorized. Arrives through `dockerode` under
  # `testcontainers`; nothing here ships it. Remove once `testcontainers` resolves 1.14.5+.
  '@grpc/grpc-js@1': '^1.14.5'
  # GHSA-27r3-jxmh-p828 (CVSS 7.5) — body-parser denial of service. Arrives through
  # `express` under `@nestjs/platform-express`, which only the test suite uses.
  'body-parser@2': '^2.4.0'
  # GHSA-jqcg-44mw-7w3h (CVSS 9.1) — IP spoofing through an IPv4-mapped IPv6 trust subnet.
  # Arrives through `express` under `@nestjs/platform-express`, test suite only.
  'proxy-addr@2': '^2.0.8'
  # GHSA-mrhx-c7xc-m3w5 (CVSS 8.2). Arrives through `mutation-server-protocol` under
  # `@stryker-mutator/core`, i.e. the manual mutation gate; nothing here ships it.
  'zod@4': '^4.6.6'
